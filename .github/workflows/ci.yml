name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# A newer push on the same ref makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 22 is the development baseline; 24 catches breakage before it lands
        # in the next LTS.
        node: ["22", "24"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      # The demo figures quoted in the README and the screenshots are only true
      # of these exact bytes, so drift is a build failure rather than a surprise.
      - name: Verify demo fixture checksums
        run: npm run data:verify

      - name: Unit and architecture tests
        run: npm run test

      # Gated on the column ERROR rate, not accuracy: a column mapped to the
      # wrong field corrupts a calculation silently, while an unmapped one
      # surfaces in the UI. The two failures are not worth the same.
      - name: Mapping eval
        run: npm run eval

      - name: Upload eval run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-run-node${{ matrix.node }}
          path: artifacts/evals/
          if-no-files-found: ignore
          retention-days: 30

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build

  smoke:
    name: Smoke test the built app
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build

      # A green build only proves it compiles. This proves the engine can
      # actually produce a declaration behind every route.
      - name: Start and exercise every route
        run: |
          npm run start -- --port 3000 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/ >/dev/null && break
            sleep 2
          done
          fail=0
          for path in "" ingest review calculate declaration audit methodology; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:3000/$path")
            echo "$code /$path"
            [ "$code" = "200" ] || fail=1
          done
          echo "--- declaration export ---"
          curl -sf "http://localhost:3000/api/export?format=csv" | head -2
          exit $fail

  docker:
    name: Container image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: carbonpass-ai:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run the container and check its health
        run: |
          docker run -d --name carbonpass -p 3000:3000 carbonpass-ai:ci
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/ >/dev/null && break
            sleep 2
          done
          curl -sf http://localhost:3000/ >/dev/null || { docker logs carbonpass; exit 1; }
          echo "container serves the app"
          docker rm -f carbonpass
