name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# A newer push on the same ref makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 22 is the development baseline; 24 catches breakage before it lands
        # in the next LTS.
        node: ["22", "24"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      # The demo figures quoted in the README and the screenshots are only true
      # of these exact bytes, so drift is a build failure rather than a surprise.
      - name: Verify demo fixture checksums
        run: npm run data:verify

      - name: Unit and architecture tests
        run: npm run test

      # Gated on the column ERROR rate, not accuracy: a column mapped to the
      # wrong field corrupts a calculation silently, while an unmapped one
      # surfaces in the UI. The two failures are not worth the same.
      - name: Mapping eval
        run: npm run eval

      - name: Upload eval run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-run-node${{ matrix.node }}
          path: artifacts/evals/
          if-no-files-found: ignore
          retention-days: 30

  e2e:
    name: End to end (${{ matrix.database }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The two storage backends a deployment can use: an external Postgres
        # (Vercel + Neon, Railway's plugin) and the embedded one (a single
        # container with a volume, local development).
        database: [postgres, embedded]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: carbonpass
          POSTGRES_PASSWORD: carbonpass
          POSTGRES_DB: carbonpass
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U carbonpass"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgres://carbonpass:carbonpass@localhost:5432/carbonpass' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build

      # A green build only proves it compiles. The smoke test signs up, opens
      # the demo, renders every screen, downloads every export, uploads and
      # confirms a file, runs the supplier portal and checks roles - over HTTP,
      # against the production server.
      - name: Start the production server
        run: |
          PORT=3000 CARBONPASS_DATA_DIR="$RUNNER_TEMP/carbonpass-data" \
            npm run start:standalone > server.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/api/health && exit 0
            sleep 2
          done
          cat server.log
          exit 1

      - name: Smoke test
        run: BASE_URL=http://localhost:3000 npm run smoke

      - name: Server log
        if: failure()
        run: cat server.log

  vercel-build:
    name: Build as Vercel does
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # Vercel sets VERCEL=1, which drops the standalone output and the embedded
      # database's files from the bundle.
      - run: npm run build
        env:
          VERCEL: "1"

  docker:
    name: Container image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: carbonpass-ai:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The image on its own, with no database service: the embedded database
      # must come up, migrate and serve the whole product.
      - name: Run the container and smoke test it
        run: |
          docker run -d --name carbonpass -p 3000:3000 carbonpass-ai:ci
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/api/health && break
            sleep 2
          done
          curl -sf http://localhost:3000/api/health || { docker logs carbonpass; exit 1; }
          BASE_URL=http://localhost:3000 node scripts/smoke.mjs || { docker logs carbonpass; exit 1; }
          docker inspect --format '{{.State.Health.Status}}' carbonpass
          docker rm -f carbonpass
